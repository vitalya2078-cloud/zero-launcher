name: Build ZERO
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong|error:|Execution failed|AAPT|Could not|not found" -A2 build.log | head -n 70 | cut -c1-400 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle errors::$msg"
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZERO build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
